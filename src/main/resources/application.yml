spring:
  application:
    name: queuecaresystem

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/queuecaresystem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

server:
  port: 8080

  servlet:
    context-path: /

jwt:
  secret: myLocalSecretKeyForJWTAuthentication123456
  expiration: 86400000

# ============================================================
# Logging Configuration
# ============================================================

logging:
  level:
    root: INFO
    com.hospital.queuecaresystem: DEBUG
    com.hospital.queuecaresystem.security: WARN
    com.hospital.queuecaresystem.config: INFO
    com.hospital.queuecaresystem.controller: INFO
    com.hospital.queuecaresystem.service: INFO
    com.hospital.queuecaresystem.exception: WARN

    org.springframework: WARN
    org.springframework.security: WARN
    org.springframework.web: INFO

    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%-5level] [%15.15thread] [%-40.40logger{39}] - %msg%n"

  file:
    name: logs/queuecaresystem.log

# ============================================================
# WebSocket Configuration
# ============================================================

websocket:
  allowed-origins: "http://localhost:3000"

  connection:
    idle-timeout: 300
    max-message-size: 65536
    enable-heartbeat: true
    heartbeat-interval: 30

# ============================================================
# STOMP Message Broker Settings
# ============================================================

stomp:
  topic-prefix: "/topic"
  queue-prefix: "/queue"
  app-prefix: "/app"
  user-prefix: "/user"